version: 2

updates:
  # ── Root pnpm workspace (lib/*, artifacts/*, scripts) ──────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # @types/node tracks the runtime (Node 22: engines, CI, Vercel). Raise it with the runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
    # Group non-breaking npm updates into one prod PR + one dev PR (same
    # patch+minor rule as the github-actions group); majors stay individual.
    groups:
      npm-prod:
        dependency-type: production
        update-types:
          - patch
          - minor
      npm-dev:
        dependency-type: development
        update-types:
          - patch
          - minor

  # ── yoyomap standalone Next.js app ─────────────────────────────────────
  # npm — yoyomap standalone app.
  - package-ecosystem: npm
    directory: /yoyomap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # @types/node tracks the runtime (Node 22: engines, CI, Vercel). Raise it with the runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
    # Group non-breaking npm updates into one prod PR + one dev PR (same
    # patch+minor rule as the github-actions group); majors stay individual.
    groups:
      npm-prod:
        dependency-type: production
        update-types:
          - patch
          - minor
      npm-dev:
        dependency-type: development
        update-types:
          - patch
          - minor

  # ── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    # Group all non-breaking (patch + minor) updates into one PR to reduce
    # noise; breaking (major) changes get their own PR so they're reviewed
    # individually.
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
