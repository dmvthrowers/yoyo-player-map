# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# ESLint is a tool for identifying and reporting on patterns
# found in ECMAScript/JavaScript code.
# More details at https://github.com/eslint/eslint
# and https://eslint.org

name: ESLint

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  eslint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Debug ESLint setup
        run: |
          node -v
          npx eslint -v
          ls -la.eslintrc.js || echo "no.eslintrc.js found"
          npm ls @microsoft/eslint-formatter-sarif

      - name: Run ESLint (verbose)
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
          ESLINT_USE_FLAT_CONFIG: "false"
        run: |
          set -x
          npx eslint. \
            --config.eslintrc.js \
            --ext.js,.jsx,.ts,.tsx \
            -f @microsoft/eslint-formatter-sarif \
            -o eslint-results.sarif 2>&1 | tee eslint.log
          echo "exit code: ${PIPESTATUS[0]}"
          ls -lh eslint-results.sarif || echo "FILE MISSING"

      - name: Show eslint log
        if: always()
        run: cat eslint.log

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true