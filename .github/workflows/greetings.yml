name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v3
      with:
        # v3 renamed inputs from kebab-case to snake_case.
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: "Thanks for opening your first issue! A maintainer will take a look soon."
        pr_message: "Thanks for your first pull request! A maintainer will review it soon."
