kind = "web"
previewPath = "/"
title = "YoYo Map"
version = "1.0.0"
id = "artifacts/yoyomap"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24404

[services.development]
run = "pnpm --filter @workspace/yoyomap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yoyomap", "run", "build" ]
publicDir = "artifacts/yoyomap/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24404"
BASE_PATH = "/"
