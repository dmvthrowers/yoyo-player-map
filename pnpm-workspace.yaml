packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.101.0
  '@types/node': ^25.3.3
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.2.7
  react-dom: 19.1.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  tsx: ^4.21.0
  vite: ^7.3.5
  wouter: ^3.3.5
  zod: 3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# Dependency overrides — the only overrides block. pnpm ignored this section
# while package.json also had "pnpm.overrides" (that block won). Security pins
# are scoped to the vulnerable range so they can't force another major.
overrides:
  # --- carried over from package.json (already in effect) ---
  fast-uri: '>=3.1.2'
  fast-xml-builder: '>=1.1.7'
  # postcss: XSS via unescaped </style>; needs >=8.5.10
  postcss: ^8.5.18
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  browserslist: ^4.28.7
  # undici: WebSocket DoS, BalancedPool TLS bypass (and earlier GHSA-f269, -v9p9, -vrm6)
  undici@>=7.0.0 <7.29.1: ^7.29.1
  # --- security pins previously defined here but never applied ---
  # picomatch 2.x (micromatch->picomatch, used by fast-glob): needs >=2.3.2
  picomatch@<2.3.2: ^2.3.2
  # picomatch 4.x (vite->picomatch): needs >=4.0.4
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  # path-to-regexp (express->router->path-to-regexp): needs >=8.4.0
  path-to-regexp@>=8.0.0 <8.4.0: ^8.4.0
  # lodash (recharts->lodash): code injection in _.template; needs >=4.18.0
  lodash@<4.18.0: ^4.18.1
  # brace-expansion (orval->typedoc->minimatch->brace-expansion): needs >=2.0.3
  brace-expansion@>=2.0.0 <2.0.3: ^2.0.3
  # yaml (vite->yaml): stack overflow; needs >=2.8.3
  yaml@>=2.0.0 <2.8.3: ^2.8.3
  # uuid (resend->svix->uuid): buffer bounds check; needs >=14.0.0
  uuid@<14.0.0: ^14.0.0
  # devalue: prototype pollution / XSS (GHSA-cfw5-2vxh-hr84, GHSA-mwv9-gp5h-frr4)
  devalue@<5.8.0: ^5.8.0
