packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.6.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.104.1
  '@types/node': ^25.3.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.3
  framer-motion: ^13.4.4
  lucide-react: ^0.545.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  vite: ^8.3.2
  wouter: ^3.13.0
  zod: 4.6.5

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# Dependency overrides — the only overrides block. pnpm ignored this section
# while package.json also had "pnpm.overrides" (that block won). Security pins
# are scoped to the vulnerable range so they can't force another major.
overrides:
  # --- audit fixes ---
  # proxy-addr (express): GHSA-jqcg-44mw-7w3h; needs >=2.0.8
  proxy-addr@<2.0.8: ^2.0.8
  # source-map-js (@tailwindcss/node): GHSA-68fv-2mgg-jv7q; needs >=1.2.2
  source-map-js@<1.2.2: ^1.2.2
  # --- carried over from package.json (already in effect) ---
  fast-uri: '>=3.1.2'
  fast-xml-builder: '>=1.1.7'
  # postcss: XSS via unescaped </style>; needs >=8.5.10
  postcss: ^8.5.18
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  browserslist: ^4.28.7
  # undici: WebSocket DoS, BalancedPool TLS bypass (and earlier GHSA-f269, -v9p9, -vrm6)
  undici@>=7.0.0 <7.29.1: ^7.29.1
  # --- security pins previously defined here but never applied ---
  # picomatch 2.x (micromatch->picomatch, used by fast-glob): needs >=2.3.2
  picomatch@<2.3.2: ^2.3.2
  # picomatch 4.x (vite->picomatch): needs >=4.0.4
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  # path-to-regexp (express->router->path-to-regexp): needs >=8.4.0
  path-to-regexp@>=8.0.0 <8.4.0: ^8.4.0
  # lodash (recharts->lodash): code injection in _.template; needs >=4.18.0
  lodash@<4.18.0: ^4.18.1
  # brace-expansion (orval->typedoc->minimatch->brace-expansion): needs >=2.0.3
  brace-expansion@>=2.0.0 <2.0.3: ^2.0.3
  # yaml (vite->yaml): stack overflow; needs >=2.8.3
  yaml@>=2.0.0 <2.8.3: ^2.8.3
  # uuid (resend->svix->uuid): buffer bounds check; needs >=14.0.0
  uuid@<14.0.0: ^14.0.0
  # devalue: prototype pollution / XSS (GHSA-cfw5-2vxh-hr84, GHSA-mwv9-gp5h-frr4)
  devalue@<5.8.0: ^5.8.0
  # --- OSV-Scanner findings on main (root lockfile) ---
  # @babel/core: GHSA-4x5r-pxfx-6jf8; needs >=7.29.6
  '@babel/core@<7.29.6': ^7.29.6
  # body-parser (express): GHSA-v422-hmwv-36x6; needs >=2.3.0
  body-parser@>=2.0.0 <2.3.0: ^2.3.0
  # qs (express, body-parser): GHSA-4mjr-xmp4-gh2g, -q8mj-m7cp-5q26, -x5fp-wj9c-mxmx; needs >=6.16.0
  qs@>=6.0.0 <6.16.0: ^6.16.0
  # esbuild 0.18 (drizzle-kit->@esbuild-kit/core-utils): GHSA-67mh-4wv8-2f99; needs >=0.25.0
  esbuild@<0.25.0: ^0.25.0
  # tsx 4.21 pins esbuild ~0.27 (GHSA-g7r4-m6w7-qqqr); tsx 4.23 uses ~0.28
  tsx@<4.23.0: ^4.23.15

# braces <=3.0.3 (fast-glob->micromatch): GHSA-vfj7-8cjw-p6xm has no patched release
# and is reachable only through dev-time globbing, so it is allow-listed.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
